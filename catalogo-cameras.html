<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catálogo de Câmeras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --bg:#12161B;
    --panel:#1B2027;
    --panel-raised:#20262E;
    --border:#2A323C;
    --accent:#4FD8C4;
    --accent-dim:#2E5C56;
    --warn:#F2A65A;
    --danger:#E2685B;
    --text:#ECEFF3;
    --text-dim:#8B95A3;
    --text-faint:#5B6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .count-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 12px;
  }
  .count-badge b{color:var(--accent);font-weight:600;}

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media(min-width:820px){
    .grid{grid-template-columns: 380px 1fr;align-items:start;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
  }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin:0 0 12px 0;
  }

  /* scanner */
  #scanner-container{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  #scanner-container video, #scanner-container canvas{
    position:absolute;
    top:0;left:0;width:100%;height:100%;object-fit:cover;
  }
  .viewfinder{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .viewfinder .box{
    width:78%;
    height:34%;
    border:2px solid var(--accent);
    border-radius:8px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
  }
  .viewfinder .scanline{
    position:absolute;
    left:0;right:0;
    height:2px;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    animation:scan 1.6s ease-in-out infinite;
  }
  @keyframes scan{
    0%{top:6%;}
    50%{top:88%;}
    100%{top:6%;}
  }
  .scanner-off{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--text-faint);font-size:13px;text-align:center;padding:20px;
  }

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel-raised);
    color:var(--text);
    padding:11px 14px;
    cursor:pointer;
  }
  button:active{transform:translateY(1px);}
  .btn-accent{
    background:var(--accent);
    border-color:var(--accent);
    color:#0B1512;
  }
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row button{flex:1;}

  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin:12px 0 5px;
  }
  input[type=text]{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 11px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  input#f-modelo, input#f-marca, input#f-local{font-family:'Inter',sans-serif;font-size:14px;}

  .duplicate-warn{
    margin-top:8px;
    font-size:12px;
    color:var(--warn);
    display:none;
  }

  /* log / catalog */
  .log-empty{
    color:var(--text-faint);
    font-size:14px;
    padding:30px 10px;
    text-align:center;
    line-height:1.6;
  }
  .entry{
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:12px;
    align-items:start;
    padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .entry:last-child{border-bottom:none;}
  .entry .idx{
    font-family:'JetBrains Mono',monospace;
    color:var(--text-faint);
    font-size:12px;
    padding-top:2px;
  }
  .entry .serial{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:0.01em;
  }
  .entry .meta{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:3px;
  }
  .entry .ts{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
    margin-top:4px;
  }
  .entry .del, .entry .edit{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-faint);
    font-size:12px;
    padding:6px 10px;
    border-radius:7px;
  }
  .entry .del:hover{color:var(--danger);border-color:var(--danger);}
  .entry .edit:hover{color:var(--accent);border-color:var(--accent);}

  .edit-banner{
    margin-top:8px;
    font-size:12px;
    color:var(--accent);
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--accent-dim);
    border:1px solid var(--accent);
    border-radius:8px;
    padding:8px 10px;
  }
  .edit-banner button{
    padding:4px 9px;
    font-size:11px;
    background:transparent;
    border-color:var(--accent);
    color:var(--accent);
  }

  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .toolbar input[type=text]{flex:1;min-width:140px;}
  .toolbar button{white-space:nowrap;}

  .toast{
    position:fixed;
    bottom:20px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--panel-raised);
    border:1px solid var(--accent);
    color:var(--text);
    padding:10px 16px;
    border-radius:9px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, transform 0.2s;
    z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* lock overlay */
  #lock-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .lock-card{
    width:100%;
    max-width:320px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:26px 22px;
    text-align:center;
  }
  .lock-icon{
    font-size:28px;
    margin-bottom:10px;
  }
  .lock-card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    margin:0 0 4px;
    text-transform:none;
    letter-spacing:0;
    color:var(--text);
  }
  .lock-sub{
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:18px;
    line-height:1.5;
  }
  .pin-input{
    width:100%;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:22px;
    letter-spacing:10px;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px 8px 12px 18px;
    color:var(--text);
    margin-bottom:10px;
  }
  .pin-input:focus{outline:none;border-color:var(--accent);}
  .lock-error{
    font-size:12px;
    color:var(--danger);
    min-height:16px;
    margin-bottom:8px;
  }
  .lock-card button{
    width:100%;
    margin-top:4px;
  }
  .lock-forgot{
    margin-top:14px;
    font-size:11.5px;
    color:var(--text-faint);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .header-actions{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:13px;
    padding:7px 10px;
    border-radius:8px;
  }
</style>
</head>
<body>

<div id="lock-overlay">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2 id="lock-title">Catálogo protegido</h2>
    <div class="lock-sub" id="lock-sub">Crie um PIN para proteger o acesso.</div>
    <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-input" placeholder="••••">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" class="pin-input" id="pin-input-confirm" placeholder="confirme o PIN" style="display:none;">
    <div class="lock-error" id="lock-error"></div>
    <button class="btn-accent" id="btn-lock-submit">Criar PIN</button>
    <button class="lock-forgot" id="btn-forgot">esqueci o PIN / redefinir</button>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>Catálogo de Câmeras</h1>
    <div class="header-actions">
      <div class="count-badge"><b id="total-count">0</b> registradas</div>
      <button class="icon-btn" id="btn-relock" title="Bloquear agora">🔒</button>
      <button class="icon-btn" id="btn-change-pin" title="Trocar PIN">PIN</button>
    </div>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>Ler código de barras</h2>
      <div id="scanner-container">
        <div id="scanner-off" class="scanner-off">
          <span>Câmera desligada</span>
        </div>
        <div class="viewfinder" id="viewfinder" style="display:none;">
          <div class="box"><div class="scanline"></div></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-accent" id="btn-toggle-scan">Ligar câmera</button>
        <button id="btn-torch" style="display:none;flex:0 0 auto;">🔦</button>
      </div>

      <label for="f-serial">Número de série</label>
      <input type="text" id="f-serial" placeholder="Ex: G25A34567" maxlength="9">
      <div class="duplicate-warn" id="format-warn">⚠ Formato esperado: G25A + 5 números (ex: G25A34567).</div>
      <div class="edit-banner" id="edit-banner">
        <span>Editando registro já catalogado</span>
        <button id="btn-cancel-edit" type="button">cancelar</button>
      </div>

      <label for="f-marca">Marca / Modelo</label>
      <input type="text" id="f-marca" placeholder="Ex: Hikvision DS-2CD2143">

      <label for="f-local">Local / observação</label>
      <input type="text" id="f-local" placeholder="Ex: Poste Av. 15 de Novembro, esquina X">

      <div class="btn-row">
        <button class="btn-accent" id="btn-save" style="flex:2;">Salvar no catálogo</button>
        <button id="btn-clear">Limpar</button>
      </div>
    </div>

    <div class="panel">
      <h2>Registros</h2>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Buscar por série, marca ou local...">
        <button id="btn-export">Exportar CSV</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'cameras-catalog-v1';
let entries = [];
let scanning = false;
let lastDetectedCode = '';
let lastDetectedTime = 0;

const $ = (id) => document.getElementById(id);

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// --- PIN lock ---
// Client-side only: keeps a casual person picking up the phone or link out.
// It's not real security — a technically capable person could read the
// source and localStorage directly. Good enough to stop "anyone" from
// opening or editing the catalog, not a determined attacker.
const PIN_KEY = 'cameras-catalog-pin-v1';

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

let lockMode = 'enter'; // 'setup' | 'enter' | 'change-verify' | 'change-new'
let storedPinHash = null;

function getStoredPinHash(){
  return localStorage.getItem(PIN_KEY) || null;
}

function setStoredPinHash(hash){
  if(hash){
    localStorage.setItem(PIN_KEY, hash);
  }else{
    localStorage.removeItem(PIN_KEY);
  }
}

function showLockOverlay(){
  $('lock-overlay').style.display = 'flex';
  setTimeout(()=>$('pin-input').focus(), 50);
}
function hideLockOverlay(){
  $('lock-overlay').style.display = 'none';
}

function renderLockUI(){
  const confirmField = $('pin-input-confirm');
  if(lockMode === 'setup'){
    $('lock-title').textContent = 'Criar um PIN';
    $('lock-sub').textContent = 'Só quem souber esse PIN vai poder abrir e editar o catálogo.';
    confirmField.style.display = 'block';
    confirmField.placeholder = 'confirme o PIN';
    $('btn-lock-submit').textContent = 'Criar PIN';
  }else if(lockMode === 'enter'){
    $('lock-title').textContent = 'Catálogo protegido';
    $('lock-sub').textContent = 'Digite o PIN para continuar.';
    confirmField.style.display = 'none';
    $('btn-lock-submit').textContent = 'Entrar';
  }else if(lockMode === 'change-verify'){
    $('lock-title').textContent = 'Trocar PIN';
    $('lock-sub').textContent = 'Digite o PIN atual.';
    confirmField.style.display = 'none';
    $('btn-lock-submit').textContent = 'Continuar';
  }else if(lockMode === 'change-new'){
    $('lock-title').textContent = 'Novo PIN';
    $('lock-sub').textContent = 'Digite o novo PIN e confirme.';
    confirmField.style.display = 'block';
    confirmField.placeholder = 'confirme o novo PIN';
    $('btn-lock-submit').textContent = 'Salvar novo PIN';
  }
  $('pin-input').value = '';
  confirmField.value = '';
  $('lock-error').textContent = '';
  $('btn-forgot').style.display = (lockMode === 'enter') ? 'inline-block' : 'none';
  setTimeout(()=>$('pin-input').focus(), 50);
}

function initLock(){
  storedPinHash = getStoredPinHash();
  lockMode = storedPinHash ? 'enter' : 'setup';
  renderLockUI();
  showLockOverlay();
}

$('btn-lock-submit').addEventListener('click', async () => {
  const val = $('pin-input').value.trim();
  const confirmVal = $('pin-input-confirm').value.trim();
  const err = $('lock-error');

  if(val.length < 4){
    err.textContent = 'O PIN precisa ter pelo menos 4 dígitos.';
    return;
  }

  if(lockMode === 'setup'){
    if(val !== confirmVal){
      err.textContent = 'Os PINs não coincidem.';
      return;
    }
    storedPinHash = await sha256(val);
    setStoredPinHash(storedPinHash);
    hideLockOverlay();
    loadEntries();
  }else if(lockMode === 'enter'){
    const h = await sha256(val);
    if(h !== storedPinHash){
      err.textContent = 'PIN incorreto.';
      $('pin-input').value = '';
      return;
    }
    hideLockOverlay();
    loadEntries();
  }else if(lockMode === 'change-verify'){
    const h = await sha256(val);
    if(h !== storedPinHash){
      err.textContent = 'PIN atual incorreto.';
      return;
    }
    lockMode = 'change-new';
    renderLockUI();
  }else if(lockMode === 'change-new'){
    if(val !== confirmVal){
      err.textContent = 'Os PINs não coincidem.';
      return;
    }
    storedPinHash = await sha256(val);
    setStoredPinHash(storedPinHash);
    hideLockOverlay();
    showToast('PIN atualizado.');
  }
});

['pin-input','pin-input-confirm'].forEach(id => {
  $(id).addEventListener('keydown', (e) => {
    if(e.key === 'Enter') $('btn-lock-submit').click();
  });
});

$('btn-forgot').addEventListener('click', () => {
  if(!confirm('Isso vai apagar o PIN atual e você poderá criar um novo. O catálogo salvo não será apagado. Continuar?')) return;
  setStoredPinHash(null);
  storedPinHash = null;
  lockMode = 'setup';
  renderLockUI();
});

$('btn-relock').addEventListener('click', () => {
  lockMode = 'enter';
  renderLockUI();
  showLockOverlay();
});

$('btn-change-pin').addEventListener('click', () => {
  lockMode = 'change-verify';
  renderLockUI();
  showLockOverlay();
});

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  render();
}

function persistEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    showToast('Erro ao salvar. Tente novamente.');
  }
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function render(filter){
  const log = $('log');
  const q = (filter || $('search').value || '').trim().toLowerCase();
  const filtered = entries.filter(e => {
    if(!q) return true;
    return (e.serial+' '+e.marca+' '+e.local).toLowerCase().includes(q);
  });

  $('total-count').textContent = entries.length;

  if(entries.length === 0){
    log.innerHTML = '<div class="log-empty">Nenhuma câmera catalogada ainda.<br>Escaneie um código de barras ou digite o número de série ao lado.</div>';
    return;
  }
  if(filtered.length === 0){
    log.innerHTML = '<div class="log-empty">Nada encontrado para essa busca.</div>';
    return;
  }

  const sorted = filtered.slice().reverse();
  log.innerHTML = sorted.map((e) => {
    const idx = entries.indexOf(e) + 1;
    const metaParts = [e.marca, e.local].filter(Boolean).join(' · ');
    return `<div class="entry" data-id="${e.id}">
      <div class="idx">#${String(idx).padStart(3,'0')}</div>
      <div>
        <div class="serial">${escapeHtml(e.serial)}</div>
        ${metaParts ? `<div class="meta">${escapeHtml(metaParts)}</div>` : ''}
        <div class="ts">${fmtTs(e.ts)}${e.updatedTs ? ' · editado ' + fmtTs(e.updatedTs) : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="edit" data-id="${e.id}">editar</button>
        <button class="del" data-id="${e.id}">remover</button>
      </div>
    </div>`;
  }).join('');

  log.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      entries = entries.filter(e => e.id !== id);
      if(editingId === id) exitEditMode();
      persistEntries();
      render();
    });
  });

  log.querySelectorAll('.edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const entry = entries.find(e => e.id === id);
      if(entry) enterEditMode(entry);
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Serial format: fixed "G25A" prefix + 5 digits that vary (e.g. G25A34567)
const SERIAL_FORMAT = /^G25A\d{5}$/i;

function checkFormat(){
  const val = $('f-serial').value.trim();
  const bad = val && !SERIAL_FORMAT.test(val);
  $('format-warn').style.display = bad ? 'block' : 'none';
  return !bad;
}

let editingId = null;

function findBySerial(serial){
  const val = (serial || '').trim().toLowerCase();
  if(!val) return null;
  return entries.find(e => e.serial.toLowerCase() === val) || null;
}

function enterEditMode(entry){
  editingId = entry.id;
  $('f-serial').value = entry.serial;
  $('f-marca').value = entry.marca || '';
  $('f-local').value = entry.local || '';
  $('edit-banner').style.display = 'flex';
  $('btn-save').textContent = 'Atualizar registro';
}

function exitEditMode(){
  editingId = null;
  $('edit-banner').style.display = 'none';
  $('btn-save').textContent = 'Salvar no catálogo';
}

// Called whenever the serial field changes (by scan or typing): if it matches
// an existing record, load that record for editing; otherwise stay in add mode.
function syncFormWithSerial(){
  const serial = $('f-serial').value.trim();
  const match = findBySerial(serial);
  if(match){
    if(editingId !== match.id) enterEditMode(match);
  }else if(editingId){
    exitEditMode();
  }
}

$('f-serial').addEventListener('input', () => { checkFormat(); syncFormWithSerial(); });

$('btn-cancel-edit').addEventListener('click', () => {
  exitEditMode();
  $('f-serial').value = '';
  $('f-marca').value = '';
  $('f-local').value = '';
});

$('btn-save').addEventListener('click', () => {
  const serial = $('f-serial').value.trim();
  if(!serial){
    showToast('Digite ou escaneie um número de série primeiro.');
    return;
  }
  const marca = $('f-marca').value.trim();
  const local = $('f-local').value.trim();

  if(editingId){
    const entry = entries.find(e => e.id === editingId);
    if(entry){
      entry.serial = serial;
      entry.marca = marca;
      entry.local = local;
      entry.updatedTs = new Date().toISOString();
    }
    showToast('Registro atualizado.');
  }else{
    const existing = findBySerial(serial);
    if(existing){
      // safety net: serial matched an existing record without triggering sync
      existing.marca = marca || existing.marca;
      existing.local = local || existing.local;
      existing.updatedTs = new Date().toISOString();
      showToast('Já existia — registro atualizado.');
    }else{
      entries.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        serial, marca, local,
        ts: new Date().toISOString()
      });
      showToast('Câmera salva no catálogo.');
    }
  }

  persistEntries();
  exitEditMode();
  $('f-serial').value = '';
  $('f-marca').value = '';
  $('f-local').value = '';
  $('format-warn').style.display = 'none';
  render();
});

$('btn-clear').addEventListener('click', () => {
  exitEditMode();
  $('f-serial').value = '';
  $('f-marca').value = '';
  $('f-local').value = '';
  $('format-warn').style.display = 'none';
});

$('search').addEventListener('input', () => render());

$('btn-export').addEventListener('click', () => {
  if(entries.length === 0){
    showToast('Nada para exportar ainda.');
    return;
  }
  const header = 'Numero de Serie,Marca/Modelo,Local/Observacao,Data\n';
  const rows = entries.map(e => {
    const cells = [e.serial, e.marca, e.local, fmtTs(e.ts)].map(v => `"${(v||'').replace(/"/g,'""')}"`);
    return cells.join(',');
  });
  const csv = header + rows.join('\n');
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catalogo-cameras.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// --- Quagga barcode scanning ---
function startScanner(){
  const container = $('scanner-container');
  Quagga.init({
    inputStream:{
      name:'Live',
      type:'LiveStream',
      target: container,
      constraints:{
        facingMode:'environment',
        width:{ideal:1920},
        height:{ideal:1080}
      },
      // restrict processing to the viewfinder box: cheaper per frame (higher
      // effective scan rate) and matches what the user actually aims at
      area:{top:'33%', right:'11%', left:'11%', bottom:'33%'}
    },
    locator:{patchSize:'medium', halfSample:false},
    numOfWorkers: 0,
    frequency: 10,
    decoder:{
      readers:['code_128_reader','ean_reader','ean_8_reader','code_39_reader','codabar_reader','upc_reader','upc_e_reader','code_93_reader']
    },
    locate:true
  }, function(err){
    if(err){
      console.error(err);
      $('scanner-off').style.display='flex';
      $('scanner-off').innerHTML = '<span>Não foi possível acessar a câmera.<br>Verifique a permissão do navegador.</span>';
      scanning = false;
      $('btn-toggle-scan').textContent = 'Ligar câmera';
      return;
    }
    Quagga.start();
    scanning = true;
    $('scanner-off').style.display='none';
    $('viewfinder').style.display='flex';
    $('btn-toggle-scan').textContent = 'Desligar câmera';
    setupTorchButton();
    setupContinuousFocus();
  });

  Quagga.onProcessed(function(result){
    const ctx = Quagga.canvas && Quagga.canvas.ctx.overlay;
    const canvas = Quagga.canvas && Quagga.canvas.dom.overlay;
    if(!ctx || !canvas || !result) return;
    ctx.clearRect(0, 0, parseInt(canvas.getAttribute('width')), parseInt(canvas.getAttribute('height')));
    if(result.boxes){
      result.boxes.filter(box => box !== result.box).forEach(box => {
        Quagga.ImageDebug.drawPath(box, {x:0, y:1}, ctx, {color:'#F2A65A', lineWidth:2});
      });
    }
    if(result.box){
      Quagga.ImageDebug.drawPath(result.box, {x:0, y:1}, ctx, {color:'#4FD8C4', lineWidth:2});
    }
  });

  Quagga.onDetected(function(result){
    const raw = result && result.codeResult && result.codeResult.code;
    if(!raw) return;
    const code = raw.trim().toUpperCase();
    const now = Date.now();
    // debounce repeated reads of the same code (accepted or rejected)
    if(code === lastDetectedCode && (now - lastDetectedTime) < 2000) return;
    lastDetectedCode = code;
    lastDetectedTime = now;
    // reject reads that don't match the known serial format (G25A + 5 digits) —
    // a garbled 1D decode is a much more likely explanation than a real serial
    // outside the expected pattern, so drop it instead of polluting the field
    if(!SERIAL_FORMAT.test(code)) return;
    $('f-serial').value = code;
    checkFormat();
    syncFormWithSerial();
    if(navigator.vibrate) navigator.vibrate(80);
    showToast(findBySerial(code) ? 'Já catalogada — editando: ' + code : 'Código lido: ' + code);
  });
}

function stopScanner(){
  try{ Quagga.stop(); }catch(e){}
  scanning = false;
  $('scanner-off').style.display='flex';
  $('scanner-off').innerHTML = '<span>Câmera desligada</span>';
  $('viewfinder').style.display='none';
  $('btn-toggle-scan').textContent = 'Ligar câmera';
  $('btn-torch').style.display = 'none';
  $('btn-torch').textContent = '🔦';
}

function getActiveVideoTrack(){
  try{
    const video = $('scanner-container').querySelector('video');
    return video && video.srcObject ? video.srcObject.getVideoTracks()[0] : null;
  }catch(e){
    return null;
  }
}

// Best-effort: keep autofocus continuously hunting instead of locking on the
// first frame, which otherwise leaves close-up barcodes permanently blurry.
// Not supported on iOS Safari; fails silently there.
function setupContinuousFocus(){
  const track = getActiveVideoTrack();
  if(!track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if(caps.focusMode && caps.focusMode.includes('continuous')){
    track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }
}

// Flashlight toggle, only shown when the device actually reports torch support
// (mostly Android Chrome; iOS Safari never does).
function setupTorchButton(){
  const track = getActiveVideoTrack();
  const btn = $('btn-torch');
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if(!track || !caps.torch){
    btn.style.display = 'none';
    return;
  }
  let torchOn = false;
  btn.style.display = 'block';
  btn.textContent = '🔦';
  btn.onclick = () => {
    torchOn = !torchOn;
    track.applyConstraints({advanced:[{torch:torchOn}]}).catch(()=>{
      showToast('Não foi possível ligar a lanterna.');
      torchOn = !torchOn;
    });
    btn.textContent = torchOn ? '🔦 ligada' : '🔦';
  };
}

$('btn-toggle-scan').addEventListener('click', () => {
  if(scanning) stopScanner();
  else startScanner();
});

initLock();
</script>
